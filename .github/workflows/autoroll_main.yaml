name: Autoroll Main

on:
  workflow_dispatch:
    inputs:
      max_commits:
        description: 'Maximum commits to include in one PR'
        type: number
        required: false
        default: 5

permissions:
  contents: write
  pull-requests: write

jobs:
  autoroll:
    name: Roll main into square-iosevka-theme
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: "WhateverTube Autoroll Bot"
      GIT_AUTHOR_EMAIL: "actions@github.com"
      GIT_COMMITTER_NAME: "WhateverTube Autoroll Bot"
      GIT_COMMITTER_EMAIL: "actions@github.com"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: square-iosevka-theme
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config --global submodule.recurse false

      - name: Fetch source and autoroll branch
        run: |
          git fetch --no-recurse-submodules origin main:refs/remotes/origin/main
          git fetch --no-recurse-submodules origin square-iosevka-theme:refs/remotes/origin/square-iosevka-theme
          git show origin/main:.github/scripts/autoroll.py > "$RUNNER_TEMP/autoroll.py"
          git show origin/main:.github/scripts/autoroll_lib.py > "$RUNNER_TEMP/autoroll_lib.py"

          if git fetch --no-recurse-submodules origin autoroll-main-to-square-iosevka-theme; then
            git checkout -B autoroll-main-to-square-iosevka-theme FETCH_HEAD
          else
            git checkout -B autoroll-main-to-square-iosevka-theme origin/square-iosevka-theme
          fi

      - name: Get existing autoroll PR
        id: pr_info
        run: |
          FIRST_SHA=$(gh pr list --head autoroll-main-to-square-iosevka-theme --state open --json commits --jq '.[0].commits[0].oid // ""')
          echo "first_sha=$FIRST_SHA" >> "$GITHUB_OUTPUT"

      - name: Cherry-pick commits
        id: autoroll
        env:
          MAX_COMMITS: ${{ inputs.max_commits || 5 }}
          FIRST_SHA: ${{ steps.pr_info.outputs.first_sha }}
        run: |
          set -euo pipefail
          PR_LINKS=$(python3 "$RUNNER_TEMP/autoroll.py" \
            --source-branch origin/main \
            --target-branch origin/square-iosevka-theme \
            --autoroll-file .github/AUTOROLL \
            --max-commits "$MAX_COMMITS" \
            --existing-pr-sha "$FIRST_SHA")

          if [[ -n "$PR_LINKS" ]]; then
            {
              echo "pr_links<<EOF"
              echo "$PR_LINKS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No commits to roll."
          fi

      - name: Push and create or update PR
        if: steps.autoroll.outputs.pr_links != ''
        env:
          PR_LINKS: ${{ steps.autoroll.outputs.pr_links }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin autoroll-main-to-square-iosevka-theme

          BODY_FILE=$(mktemp)
          {
            echo "Automated cherry-pick roll from `main` to `square-iosevka-theme`."
            echo
            echo "Commits included:"
            echo "$PR_LINKS"
          } > "$BODY_FILE"

          PR_NUMBER=$(gh pr list --head autoroll-main-to-square-iosevka-theme --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "Autoroll main → square-iosevka-theme" --body-file "$BODY_FILE"
          else
            gh pr create --base square-iosevka-theme --head autoroll-main-to-square-iosevka-theme \
              --title "Autoroll main → square-iosevka-theme" --body-file "$BODY_FILE"
          fi
