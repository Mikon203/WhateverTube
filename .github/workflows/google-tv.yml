name: Google TV (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-tv.yml"
      - "cobalt/**"
      - ".gclient"
      - "DEPS"

permissions:
  contents: read

concurrency:
  group: google-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-google-tv:
    name: Build Google TV APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_UPDATE: "0"
      DEPOT_TOOLS_REPORT_BUILD: "0"
      DEPOT_TOOLS_COLLECT_METRICS: "0"
      DEPOT_TOOLS_METRICS: "0"
      GCLIENT_PY3: "1"

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config \
            python3 python3-dev python3-pip git curl wget unzip zip \
            xz-utils zstd bzip2 jq gperf libglib2.0-0 libnss3 \
            libdbus-1-3 libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxtst6 libgbm1 libasound2 \
            libxkbcommon0 libpango-1.0-0 gcc-multilib

      - name: Checkout WhateverTube
        uses: actions/checkout@v4
        with:
          path: cobalt/src
          fetch-depth: 1

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git cobalt/depot_tools
          echo "${GITHUB_WORKSPACE}/cobalt/depot_tools" >> "${GITHUB_PATH}"
          echo "DEPOT_TOOLS_DIR=${GITHUB_WORKSPACE}/cobalt/depot_tools" >> "${GITHUB_ENV}"

      - name: Bootstrap depot_tools
        run: |
          source cobalt/depot_tools/bootstrap_python3
          bootstrap_python3
          build_telemetry opt-out

      - name: Configure Cobalt dependencies
        working-directory: cobalt
        run: |
          gclient config --name=src "${{ github.server_url }}/${{ github.repository }}"
          printf "\ntarget_os=['android']\n" >> .gclient
          gclient validate
          gclient sync --verbose --shallow --no-history --nohooks --force --delete_unversioned_trees --revision "${GITHUB_SHA}"

      - name: Run dependency hooks
        working-directory: cobalt
        run: gclient runhooks --verbose

      - name: Generate Android ARM64 build
        working-directory: cobalt/src
        run: cobalt/build/gn.py -p android-arm64 -C qa --no-rbe

      - name: Compile Google TV APK
        working-directory: cobalt/src
        run: |
          set -euxo pipefail
          autoninja -C out/android-arm64_qa cobalt/android:cobalt_apk

      - name: Upload Google TV APK
        uses: actions/upload-artifact@v4
        with:
          name: WhateverTube-Google-TV-Android-ARM64
          path: |
            cobalt/src/out/android-arm64_qa/apks/*.apk
            cobalt/src/out/android-arm64_qa/*_apk/*.apk
          if-no-files-found: error
          retention-days: 14
